{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block nav %}
    <a href="/register"> Register</a>
    <a href="/login"> Login</a>
{% endblock %}
{% block content %}
<div class="card">
    <h2>Create account</h2>
    <div id="message"></div>
    <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="email"/>
    </div>
    <div class="form-group">
        <label>Parola</label>
        <input type="password" id="password"/>
    </div>
        <div class="form-group">
        <label>Confirma Parola</label>
        <input type="confirmPassword" id="confirmPassword"/>
    </div>
        <div class="form-group">
        <label>Rol</label>
        <select id="role">
            <option value="ANALYST">Analyst</option>
            <option valued="MANAGER">Manager</option>
        </select>
    </div>
    <button onclick="Register()">creaza cont</button>
    <p class="text-center mt"> <a href="/login">Am deja cont</a></p>
</div>
{% endblock %}
