{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="card">
    <h2>Parola Noua</h2>
    <div id="message"></div>
    <div class="form-group">
        <label>Parola noua</label>
        <input type="password" id="new_password" placeholder="Parola noua">
    </div>
    <button class="btn btn-primary btn-full" onclick="Reset('{{ token }}')">Reseteaza</button>
</div>
{% endblock %}
